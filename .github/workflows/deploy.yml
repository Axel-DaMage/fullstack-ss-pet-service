name: Deploy to EC2 Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build pet-service
        run: mvn clean package -DskipTests

      - name: Build geo-service
        working-directory: ../fullstack-ss-geo-service
        run: mvn clean package -DskipTests

      - name: Build match-service
        working-directory: ../fullstack-ss-match-service
        run: mvn clean package -DskipTests

      - name: Create deployment package
        run: |
          mkdir -p deploy-backend
          cp fullstack-ss-pet-service/target/*.jar deploy-backend/pet-service.jar
          cp fullstack-ss-pet-service/Dockerfile deploy-backend/pet-service/Dockerfile
          cp fullstack-ss-geo-service/target/*.jar deploy-backend/geo-service.jar
          cp fullstack-ss-geo-service/Dockerfile deploy-backend/geo-service/Dockerfile
          cp fullstack-ss-match-service/target/*.jar deploy-backend/match-service.jar
          cp fullstack-ss-match-service/Dockerfile deploy-backend/match-service/Dockerfile
          cp fullstack-ss-pet-service/docker-compose.yml deploy-backend/docker-compose.yml

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-backend"
          target: "/opt/backend"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/backend
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            docker-compose up -d --build