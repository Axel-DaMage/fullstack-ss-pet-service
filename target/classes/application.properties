spring.application.name=pet-service
server.port=${PORT:3001}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sanosysalvos}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:local_user}
spring.datasource.password=${DB_PASS:local_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db-changelog-master.xml

logging.level.com.sanosysalvos=INFO
logging.level.org.springframework.web=INFO

service.external-api.url=http://external-api:8080
service.cache.enabled=true
service.cache.ttl=3600